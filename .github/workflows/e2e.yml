name: E2E (manual)

# Manual only (gh workflow run e2e.yml) — not run on push or pull_request.
on:
  workflow_dispatch:

jobs:
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # e2e forges its sessions with this BETTER_AUTH_SECRET, so a random one
      # works as well as the real one.
      - name: Placeholder .dev.vars
        run: |
          cp .dev.vars.example .dev.vars
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -hex 32)|; s|^GOOGLE_CLIENT_ID=.*|GOOGLE_CLIENT_ID=ci-placeholder|; s|^GOOGLE_CLIENT_SECRET=.*|GOOGLE_CLIENT_SECRET=ci-placeholder|" .dev.vars
      - run: bun run cf-typegen
      # Build first so src/paraglide/ exists before the dev server's
      # dependency scan runs — without it vite skips pre-bundling and the app
      # ends up with two React copies ("Cannot read properties of null
      # (reading 'useEffect')"), which breaks SSR of the admin pages.
      - run: bun run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
